<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        .active {
            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
            color: white !important;
        }
    </style>
    <title>Pan Tadeusz</title>
</head>
<body>
    <header class="bg-danger text-white text-center py-4 mb-4">
        <h1>Pan Tadeusz, czyli ostatni zajazd na Litwie: <br> historia szlachecka z roku 1811 i 1812 we dwunastu księgach wierszem</h1>
        <p>Adam Mickiewicz</p>
    </header>

    <section class="container">
        <div class="row">
            <div class="col-4">
                <div class="list-group" id="toc">
                    <a href="./index.html" class="list-group-item list-group-item-action">Strona główna</a>
                </div>
            </div>
            <div class="col-8" id="content">
                </div>
        </div>
    </section>

    <footer class="bg-danger-subtle text-center py-3 mt-4">
        <p>Jan Gołdyn, Akademia Nauk Stosowanych w Nowym Targu</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    
    <script type="text/javascript">
        for (let i = 1; i <= 12; i++) {
            let a = document.createElement('a');
            a.href = "?k=" + i;
            a.className = "list-group-item list-group-item-action";
            a.innerHTML = "Księga " + i;
            document.getElementById('toc').appendChild(a);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const ksiegaId = urlParams.get("k");
        const contentDiv = document.getElementById("content");

        if (ksiegaId) {
            document.querySelectorAll("#toc > a").forEach(function(elem) {
                if (elem.getAttribute('href') === "?k=" + ksiegaId) {
                    elem.classList.add("active");
                }
            });

            fetch("./k" + ksiegaId + ".html")
                .then(response => {
                    if (!response.ok) throw new Error("Błąd ładowania pliku");
                    return response.text();
                })
                .then(data => {
                    contentDiv.innerHTML = data;
                })
                .catch(error => {
                    contentDiv.innerHTML = "<p class='text-danger'>Nie udało się załadować treści księgi " + ksiegaId + ".</p>";
                });
        } else {
            let img = document.createElement('img');
            img.src = "./pan-tadeusz.jpg"
            img.alt = "Pan Tadeusz";
            img.className = "img-fluid mb-4";
            contentDiv.appendChild(img);
            document.querySelector("#toc > a").classList.add("active");
        }
        function hide_show() {
            var x = document.getElementById("book_content");
            if (x.style.display === "none") {
                x.style.display = "block";
                document.querySelector(".btn").innerHTML = "Zwiń";
            } else {
                x.style.display = "none";
                document.querySelector(".btn").innerHTML = "Rozwiń"
            }
        }
    </script>
</body>
</html>
